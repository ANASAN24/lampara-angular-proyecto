<div class="cab">
  <div class="estado">
  @if(this.enchufada){
    <span>Estado conexión electrica: ENCHUFADA</span>
  } @else {
    <span>Estado conexión electrica: DESENCHUFADA</span>
  }
  </div>

  <div>
    @if (this.enchufada){
       <button class="boton"(click)="onClickDesenchufar()">DESENCHUFAR</button>
    } @else {
      <button class="boton"(click)="onClickEnchufar()">ENCHUFAR</button>
    }

  </div>


</div>


<app-lampara [enchufadaHIJA]="this.enchufada" (estadoLampara)="onCambioEstadoLampara()">

</app-lampara>
